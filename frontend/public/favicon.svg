<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>

    <linearGradient id="alertGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Main Rounded Container -->
  <rect x="0" y="0" width="100" height="100" rx="24" fill="url(#bgGrad)" filter="url(#dropShadow)" />

  <!-- Desk Line Accent -->
  <path d="M 16,76 L 84,76" stroke="#60A5FA" stroke-width="4" stroke-linecap="round" opacity="0.4" />

  <!-- Calendar Base Body -->
  <rect x="22" y="24" width="56" height="52" rx="10" fill="#FFFFFF" />

  <!-- Calendar Top Header Bar -->
  <path d="M 22,34 C 22,28.477 26.477,24 32,24 L 68,24 C 73.523,24 78,28.477 78,34 L 78,38 L 22,38 Z" fill="url(#accentGrad)" />

  <!-- Binder Rings -->
  <rect x="34" y="18" width="4" height="10" rx="2" fill="#93C5FD" />
  <rect x="62" y="18" width="4" height="10" rx="2" fill="#93C5FD" />

  <!-- Checkmark -->
  <path d="M 34,55 L 44,65 L 66,43" fill="none" stroke="#2563EB" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Reminder Bell Badge -->
  <g transform="translate(68, 16)">
    <circle cx="12" cy="12" r="14" fill="#FFFFFF" />
    <circle cx="12" cy="12" r="11" fill="url(#alertGrad)" />
    <path d="M 12,6 C 9.79,6 8,7.79 8,10 L 8,13 L 6.5,14.5 C 6.18,14.82 6.41,15.37 6.85,15.37 L 17.15,15.37 C 17.59,15.37 17.82,14.82 17.5,14.5 L 16,13 L 16,10 C 16,7.79 14.21,6 12,6 Z" fill="#FFFFFF" />
    <path d="M 10.5,16.5 C 10.5,17.33 11.17,18 12,18 C 12.83,18 13.5,17.33 13.5,16.5" fill="none" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round" />
  </g>
</svg>
